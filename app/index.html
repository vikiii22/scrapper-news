<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela - Predicciones IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🎯 Quiniela - Predicciones</h1>
            <div class="jornada">Jornada 45</div>
            <div class="timestamp" id="timestamp"></div>
        </div>

        <!-- Legend -->
        <div class="legend">
            <div class="legend-item">
                <div class="legend-label">Probabilidades</div>
                <div class="legend-values">
                    <span>%1</span>
                    <span>%X</span>
                    <span>%2</span>
                </div>
            </div>
        </div>

        <!-- Matches -->
        <div class="matches" id="matches-container">
            <!-- Los partidos se cargarán dinámicamente con JavaScript -->
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>Predicciones generadas por IA basadas en análisis de datos históricos</p>
            <p>🤖 Scrapper News © 2026</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
